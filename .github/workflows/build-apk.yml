name: Build APK Absensi Kebun

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: 'URL backend (contoh: http://IP-RDP-KAMU:3000/) - WAJIB pakai / di akhir'
        required: true
        default: 'http://10.0.2.2:3000/'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK release
        run: |
          gradle assembleRelease \
            -PapiBaseUrl="${{ github.event.inputs.apiBaseUrl || 'http://10.0.2.2:3000/' }}"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: absensi-kebun-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
